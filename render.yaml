services:
  # Tu aplicación Spring Boot
  - name: ogma-api
    type: web
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/ogma-api-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: ogma-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Base de datos principal para tu aplicación
  - name: ogma-postgres
    type: pserv
    runtime: postgresql
    plan: free

  # Base de datos para Metabase
  - name: metabase-postgres
    type: pserv
    runtime: postgresql
    plan: free

  # Metabase
  - name: metabase
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile.metabase
    envVars:
      - key: MB_DB_TYPE
        value: postgres
      - key: MB_DB_DBNAME
        value: metabase
      - key: MB_DB_PORT
        value: 5432
      - key: MB_DB_USER
        value: metabase
      - key: MB_DB_PASS
        fromDatabase:
          name: metabase-postgres
          property: password
      - key: MB_DB_HOST
        fromDatabase:
          name: metabase-postgres
          property: host 