services:
  # Tu aplicación Spring Boot
  - name: ogma-api
    type: web
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/ogma-api-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true 